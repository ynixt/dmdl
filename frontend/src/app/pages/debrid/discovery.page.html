<div class="page">
  <h1>{{ 'KZ.DISCOVERY' | translate }}</h1>
  @if (error()) {
    <p role="alert" class="error">{{ error() | translate }}</p>
  }
  <app-search-bar [catalogs]="catalogs" (submitted)="search($event)" />
  @for (catalog of rows; track key(catalog)) {
    @if (!hidden().includes(key(catalog))) {
      <app-catalog-row
        [catalog]="catalog"
        [manifest]="addons.metadata?.manifest"
        [restored]="restored[key(catalog)]"
        (changed)="update(catalog, $event)"
        (unavailable)="hide(catalog)"
        (open)="open($event)"
      />
    }
  }
</div>

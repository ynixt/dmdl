<p-password
  [inputId]="inputId()"
  [ngModel]="value()"
  (ngModelChange)="updateValue($event)"
  [ngModelOptions]="{ standalone: true }"
  (onBlur)="markTouched()"
  [disabled]="isDisabled()"
  [invalid]="invalid()"
  [placeholder]="placeholder()"
  [autocomplete]="autocomplete()"
  [feedback]="false"
  [toggleMask]="true"
  [fluid]="true"
  [pt]="passthrough()"
>
  <ng-template #showicon let-iconClass="class">
    <button
      type="button"
      class="secret-input-toggle"
      [class]="iconClass"
      [attr.aria-label]="'COMMON.SHOW_SECRET' | translate"
      [attr.aria-controls]="inputId()"
      [disabled]="isDisabled()"
      (click)="keepToggleFocus($event)"
    >
      <i class="pi pi-eye" aria-hidden="true"></i>
    </button>
  </ng-template>
  <ng-template #hideicon let-iconClass="class">
    <button
      type="button"
      class="secret-input-toggle"
      [class]="iconClass"
      [attr.aria-label]="'COMMON.HIDE_SECRET' | translate"
      [attr.aria-controls]="inputId()"
      [disabled]="isDisabled()"
      (click)="keepToggleFocus($event)"
    >
      <i class="pi pi-eye-slash" aria-hidden="true"></i>
    </button>
  </ng-template>
</p-password>

# Debrid Media Downloader - example Docker Compose setup.
# Put this file next to a .env file (see .env.example) and run: docker compose up -d
name: dmdl
services:
  dmdl:
    # backend + frontend (nginx) + aria2 in a single container
    image: ghcr.io/ynixt/dmdl:latest
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      DMDL_REDIS_HOST: redis
      DMDL_REDIS_PASSWORD: ${DMDL_REDIS_PASSWORD}
      DMDL_SESSION_TIMEOUT: ${DMDL_SESSION_TIMEOUT:-30d}
    ports:
      - ${DMDL_PORT:-8080}:8080
    volumes:
      # SQLite database at /data/dmdl.db, aria2 session/config at /data/aria2
      - application_data:/data
      # Downloads; register destinations under /media in the app
      - ${DMDL_MEDIA_PATH:-./media}:/media
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      # aria2 RPC + backend readiness + nginx
      test: [CMD, /usr/local/bin/dmdl-healthcheck]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
  redis:
    image: redis:8.10.3-alpine
    restart: unless-stopped
    command: [redis-server, --requirepass, "${DMDL_REDIS_PASSWORD}", --appendonly, "yes"]
    volumes:
      - redis_data:/data
    environment:
      REDISCLI_AUTH: ${DMDL_REDIS_PASSWORD}
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  application_data:
  redis_data:

# Debrid Media Downloader - example Docker Compose setup.
# Put this file next to a .env file (see .env.example) and run: docker compose up -d
name: dmdl
services:
  dmdl:
    # backend + frontend (nginx) + aria2 in a single container
    image: ghcr.io/ynixt/dmdl:latest
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      DMDL_REDIS_HOST: redis
      DMDL_REDIS_PASSWORD: ${DMDL_REDIS_PASSWORD}
      DMDL_SESSION_TIMEOUT: ${DMDL_SESSION_TIMEOUT:-30d}
      # Using a Redis where the dmdl user cannot run CONFIG (e.g. an ACL without @admin)?
      # Set this to "none" and add "notify-keyspace-events Egx" to that Redis server's redis.conf.
      # DMDL_REDIS_CONFIGURE_ACTION: none
      # aria2 log detail: debug, info, notice (default), warn or error.
      # info and debug also log download URLs, and debrid links can carry tokens.
      # DMDL_ARIA2_LOG_LEVEL: info
      # Owner of downloaded files (run `id` on the host). Without them, files belong to root.
      # Do not use `user:` for this; the container must start as root.
      # DMDL_PUID: 1000
      # DMDL_PGID: 1000
      # Set to "true" to log one nginx access line per request (off by default).
      # DMDL_NGINX_ACCESS_LOG: "true"
    ports:
      - ${DMDL_PORT:-8080}:8080
    volumes:
      # SQLite database at /data/dmdl.db, aria2 session/config at /data/aria2
      - application_data:/data
      # Downloads; register destinations under /media in the app
      - ${DMDL_MEDIA_PATH:-./media}:/media
    depends_on:
      redis:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      # aria2 RPC + backend readiness + nginx
      test: [CMD, /usr/local/bin/dmdl-healthcheck]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
  redis:
    image: redis:8.10.3-alpine
    restart: unless-stopped
    command: [redis-server, --requirepass, "${DMDL_REDIS_PASSWORD}", --appendonly, "yes"]
    volumes:
      - redis_data:/data
    environment:
      REDISCLI_AUTH: ${DMDL_REDIS_PASSWORD}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  application_data:
  redis_data:

# Keep the scheme/host of an outer reverse proxy (e.g. TLS termination) so the backend sees
# browser requests as same-origin and no CORS configuration is needed.
map $http_x_forwarded_proto $dmdl_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}
map $http_x_forwarded_host $dmdl_forwarded_host {
    default $http_x_forwarded_host;
    ""      $http_host;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Written by the entrypoint: "access_log off;" unless DMDL_NGINX_ACCESS_LOG=true.
    include /run/dmdl/nginx-access-log.conf;

    location ~ ^/(index\.html|i18n/.*\.json)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location /api/ {
        error_page 502 504 =503 /__dmdl/backend-state.json;
        proxy_intercept_errors off;
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $dmdl_forwarded_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $dmdl_forwarded_proto;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    location = /api/auth/registration {
        error_page 502 504 =503 /__dmdl/backend-state.json;
        proxy_intercept_errors off;
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $dmdl_forwarded_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $dmdl_forwarded_proto;
        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    location = /__dmdl/backend-state.json {
        internal;
        root /run;
        try_files /dmdl-status/backend-state.json @backend_unavailable;
        default_type application/json;
        add_header Cache-Control "no-store" always;
    }

    location @backend_unavailable {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 503 '{"code":"BACKEND_UNAVAILABLE"}';
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

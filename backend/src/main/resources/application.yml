spring:
  application:
    name: dmdl
  threads:
    virtual:
      enabled: true
  data:
    redis:
      host: ${DMDL_REDIS_HOST:localhost}
      port: ${DMDL_REDIS_PORT:6379}
      username: ${DMDL_REDIS_USERNAME:}
      password: ${DMDL_REDIS_PASSWORD:}
      database: ${DMDL_REDIS_DATABASE:0}
  session:
    data:
      redis:
        repository-type: indexed
        # notify-keyspace-events: enable keyspace notifications at startup (needs CONFIG permission)
        # none: skip it; the Redis server must then have "notify-keyspace-events Egx" configured
        configure-action: ${DMDL_REDIS_CONFIGURE_ACTION:notify-keyspace-events}
  jpa:
    open-in-view: false
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: validate
      naming:
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
  flyway:
    enabled: true
    locations: classpath:db/sqlite
server:
  forward-headers-strategy: framework
  port: ${DMDL_SERVER_PORT:8080}
  servlet:
    session:
      timeout: ${DMDL_SESSION_TIMEOUT:30d}
      cookie:
        max-age: ${DMDL_SESSION_TIMEOUT:30d}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
application:
  database:
    path: ${DMDL_DB_PATH:./data/dmdl.db}
    busy-timeout-millis: ${DMDL_DB_BUSY_TIMEOUT_MILLIS:5000}
  storage:
    root: ${DMDL_MEDIA_PATH:./media}
  aria2:
    rpc-url: ${DMDL_ARIA2_RPC_URL:http://127.0.0.1:${DMDL_ARIA2_RPC_PORT:16843}/jsonrpc}
    rpc-secret: ${DMDL_ARIA2_RPC_SECRET:change-me}
    poll-interval: ${DMDL_ARIA2_POLL_INTERVAL:1s}
    progress-publication-interval: ${DMDL_ARIA2_PROGRESS_PUBLICATION_INTERVAL:1s}
    application-staging-root: ${DMDL_ARIA2_APPLICATION_STAGING_ROOT:}
    daemon-staging-root: ${DMDL_ARIA2_DAEMON_STAGING_ROOT:/downloads/.dmdl}
    connect-timeout: 3s
    request-timeout: 10s
  security:
    allowed-origins: ${DMDL_CORS_ALLOWED_ORIGINS:http://localhost:4200}

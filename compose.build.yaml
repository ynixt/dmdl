# Builds dmdl from this checkout and runs it with its own Redis, for local testing.
# Works without a .env file:  docker compose -f compose.build.yaml up -d --build   (or: make up)
# Uses its own project name and volumes, so it never touches an installation started from compose.yaml.
name: dmdl-local
services:
  dmdl:
    build: .
    image: dmdl:local
    stop_grace_period: 30s
    environment:
      DMDL_REDIS_HOST: redis
      DMDL_REDIS_PASSWORD: ${DMDL_REDIS_PASSWORD:-dmdl-local}
      DMDL_SESSION_TIMEOUT: ${DMDL_SESSION_TIMEOUT:-30d}
      # aria2 log detail: debug, info, notice (default), warn or error.
      # info and debug also log download URLs, and debrid links can carry tokens.
      # DMDL_ARIA2_LOG_LEVEL: info
      # Set to "true" to log one nginx access line per request (off by default).
      # DMDL_NGINX_ACCESS_LOG: "true"
    ports:
      - ${DMDL_PORT:-8080}:8080
    volumes:
      - application_data:/data
      - ${DMDL_MEDIA_PATH:-./media}:/media
    depends_on:
      redis:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: [CMD, /usr/local/bin/dmdl-healthcheck]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
  redis:
    image: redis:8.10.3-alpine
    command: [redis-server, --requirepass, "${DMDL_REDIS_PASSWORD:-dmdl-local}", --appendonly, "yes"]
    volumes:
      - redis_data:/data
    environment:
      REDISCLI_AUTH: ${DMDL_REDIS_PASSWORD:-dmdl-local}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  application_data:
  redis_data:
